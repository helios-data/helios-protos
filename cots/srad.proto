syntax = "proto3";

package helios.cots;

option go_package = "/cots";

enum FlightState {
    STANDBY = 0;
    ASCENT = 1;
    MACH_LOCK = 2;
    DROGUE_DESCENT = 3;
    MAIN_DESCENT = 4;
    LANDED = 5;
}

message Vec2 {
  float x = 1;
  float y = 2;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Baro {
  bool healthy = 1;
  float pressure = 2;
  float temperature = 3;
  float altitude = 4;
  float nis = 5;
  uint32 faults = 6;
}

message TelemetryPacket {
    // Packet metadata
    uint32 counter = 1;
    uint32 timestamp_ms = 2;

    // Flight state
    FlightState state = 3;

    // IMU data
    Vec3 accel = 4;
    Vec3 gyro = 5;

    // Kalman filter estimates
    float kf_altitude = 10;
    float kf_velocity = 11;
    float kf_alt_variance = 22;
    float kf_vel_variance = 23;

    // Barometer data
    repeated Baro barometers = 6;

    // Reference
    float ground_altitude = 14;

    // GPS data
    float gps_latitude = 15;
    float gps_longitude = 16;
    float gps_altitude = 17;
    float gps_speed = 18;
    uint32 gps_sats = 19;
    uint32 gps_fix = 20;

    // RunCam Status
    bool runcam_power = 21;
    bool runcam_recording = 34;
}