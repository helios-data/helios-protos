syntax = "proto3";

package helios.config;

option go_package = "/config";

message BaseComponent {
  string name = 1;

  oneof node_type {
    Component leaf = 2;
    ComponentGroup branch = 3;
  }
}

message Component {
  DockerSpec docker_spec = 1;
}

message DockerSpec {
  string image = 1;
  string tag = 2;
  repeated Volume volumes = 3;
  repeated Port ports = 4;
  string container_name = 5;
  bool skip_spawn = 6;
}

message ComponentGroup {
  repeated BaseComponent children = 1;
}

message ComponentTree {
  BaseComponent root = 1;
  string version = 2;
}

message Port {
  string type = 1;
  string source = 2;
  string target = 3;
  string read_only = 4;
}

message Volume {
  string source = 1;
  string target = 2;
  string mode = 3;
}
