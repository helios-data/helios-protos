syntax = "proto3";
package helios.tvr;

option go_package = "/tvr";

import "common.proto";

// Full state + control output, sent at 10Hz from FC to ground station.
//
// General-purpose: every section is optional. A field or sub-message that is
// not set costs zero bytes on the wire, so a vehicle/test that lacks a
// subsystem (e.g. no UWB on a hop test) simply leaves it empty. Source vehicle
// and wall-clock time are carried by the Helios transport Event envelope
// (source_address / timestamp), so they are not duplicated here.
message TelemetryState {
  // Packet metadata
  uint32      timestamp_ms = 1;  // FC clock, ms since boot (wraps at ~49 days)
  uint32      seq          = 2;  // Monotonic packet counter, for drop detection
  FlightState flight_state = 3;

  NavState           nav       = 4;   // EKF estimate
  repeated ImuSample imu       = 5;   // Raw IMU samples since the last packet
  Guidance           guidance  = 6;   // Setpoints + path-following progress
  ControlOutput      control   = 7;   // High-level control command
  repeated Actuator  actuators = 8;   // Per-actuator command/feedback
  repeated Motor     motors    = 9;   // Per-motor ESC telemetry
  repeated UwbTag    uwb       = 10;  // On-board UWB tag solutions
  Power              power     = 11;  // Battery / power rail
}

// EKF state estimate (nav frame unless noted).
message NavState {
  Vec3       position     = 1;  // [m]
  Vec3       velocity     = 2;  // [m/s]
  Quaternion attitude     = 3;  // body-to-nav
  Vec3       angular_rate = 4;  // [rad/s] body frame

  // Filter health (trace of the relevant covariance block). Unset if the
  // filter does not report it.
  optional float pos_variance = 5;  // [m^2]
  optional float vel_variance = 6;  // [(m/s)^2]
}

// One raw IMU sample. Multiple samples may be batched into a single packet;
// each carries its own time offset so accel and gyro stay paired in time.
message ImuSample {
  uint32 sensor_id = 1;  // 0 for the primary IMU
  sint32 dt_us     = 2;  // [us] offset from TelemetryState.timestamp_ms
  Vec3   accel     = 3;  // [m/s^2] body frame
  Vec3   gyro      = 4;  // [rad/s] body frame
}

// Guidance / path-following setpoints. Unset when no trajectory is active.
message Guidance {
  Vec3       position_sp = 1;  // [m] nav frame
  Vec3       velocity_sp = 2;  // [m/s] nav frame
  Quaternion attitude_sp = 3;  // body-to-nav

  optional uint32 waypoint_index = 4;  // Active waypoint in the loaded path
}

// High-level control command, independent of the actuation mechanism
// (servo gimbal, linear actuators, ...).
message ControlOutput {
  optional float thrust_cmd = 1;  // [N]
  Vec2           gimbal_cmd = 2;  // [rad] thrust-vector deflection (x, y)
}

// A single thrust-vector actuator (servo, linear actuator, ...). Units depend
// on the actuator type: [rad] for rotary, [m] for linear.
message Actuator {
  uint32         id        = 1;
  optional float commanded = 2;
  optional float measured  = 3;  // Unset if the actuator has no feedback
}

// A single motor/ESC, from bidirectional-DShot (EDT) telemetry. Each field is
// unset when the decoded frame was missing/corrupt this tick or the backend
// does not provide it.
message Motor {
  uint32         id        = 1;  // e.g. 0 = lower, 1 = upper
  optional float rpm       = 2;  // [rpm]
  optional float voltage   = 3;  // [V]
  optional float current   = 4;  // [A]
  optional float temp_c    = 5;  // [degC]
}

// On-board UWB tag position, computed by the flight controller via
// trilateration against the ground anchors set by SetProbeLayout. Only present
// when that tag's ranging frame was usable this tick.
message UwbTag {
  uint32         id            = 1;
  Vec3           position      = 2;  // [m] nav frame (z = 0 if 2-D solve)
  repeated float anchor_ranges = 3;  // [m] raw range to each anchor, in layout order
}

// Battery / power rail.
message Power {
  optional float battery_v = 1;  // [V]
  optional float current_a = 2;  // [A]
}